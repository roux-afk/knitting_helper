appId: local.petelka.workshop
productName: Петелька
directories:
  output: dist
files:
  - electron/dist/**/*
  - package.json
  - '!node_modules/**/*'
extraResources:
  - from: desktop/server
    to: server
  - from: desktop/server/node_modules
    to: server/node_modules
  - from: desktop/schema
    to: schema
  - from: desktop/build-info.json
    to: build-info.json
asar: true
publish:
  provider: github
  owner: roux-afk
  repo: knitting_helper
  releaseType: release
npmRebuild: false
afterPack: scripts/check-package.cjs
mac:
  icon: desktop/icon.png
  category: public.app-category.lifestyle
  target: [dmg, zip]
win:
  icon: desktop/icon.png
  target: [nsis]
  signExecutable: false
nsis:
  oneClick: false
  artifactName: Petelka-${version}-windows-${arch}-setup.${ext}
  installerLanguages: [ru_RU, en_US]
  language: '1049'
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
